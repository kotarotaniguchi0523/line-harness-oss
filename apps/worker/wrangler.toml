name = "line-crm-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
account_id = "37f8f88be4c099329e4647bda211bb9f"

# API_KEY is set via `wrangler secret put API_KEY`
# Do NOT hardcode secrets here

[vars]
WORKER_URL = "https://line-crm-worker.line-crm-api.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "YOUR_D1_DATABASE_ID"

# KV Namespace for caching (job dedup, rate limiting, etc.)
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

# Queue for background jobs (free tier: 100k messages/day)
[[queues.producers]]
binding = "JOB_QUEUE"
queue = "line-crm-jobs"

[[queues.consumers]]
queue = "line-crm-jobs"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "line-crm-jobs-dlq"

# R2 Bucket for media assets (images, rich menu assets, form attachments)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "line-crm-media"

[triggers]
crons = ["*/5 * * * *"]
